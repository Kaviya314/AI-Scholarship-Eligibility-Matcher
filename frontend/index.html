<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SchemeMatch AI — AI Scholarship & Government Scheme Eligibility Matcher</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              200: '#99f6e4',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a',
            },
            saasblue: {
              50: '#f0f6ff',
              100: '#e0edff',
              200: '#bae0fd',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#0f172a',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- React, ReactDOM, Babel for zero-build instant browser demo -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
    }
    h1, h2, h3, h4, .brand-font {
      font-family: 'Outfit', sans-serif;
    }
    @keyframes shimmer {
      100% { transform: translateX(100%); }
    }
    .shimmer-loading {
      position: relative;
      overflow: hidden;
    }
    .shimmer-loading::after {
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      transform: translateX(-100%);
      background-image: linear-gradient(90deg, rgba(255,255,255,0) 0, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
      animation: shimmer 1.5s infinite;
      content: '';
    }
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      body { background-color: #ffffff; }
      .shadow-md, .shadow-lg, .shadow-xl { box-shadow: none !important; }
    }
  </style>
</head>
<body class="text-slate-800 antialiased bg-slate-50 min-h-screen">
  <div id="root"></div>

  <!-- React Application Source -->
  <script type="text/babel" src="/app.js"></script>
</body>
</html>
